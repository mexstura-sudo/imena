<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Лесные имена — Байкальский Скаут</title>
<meta name="description" content="База лесных имён организации «Байкальский Скаут»">
<meta name="theme-color" content="#F5EEDF">
<link href="../assets/fonts/manrope.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
<style>
#forest{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding-block:0 calc(80px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;min-height:100vh;min-height:100dvh}
.blob{position:absolute;pointer-events:none;z-index:-1}
.hero{padding:calc(56px + env(safe-area-inset-top,0px)) 4px 22px;display:flex;flex-direction:column;gap:10px;max-width:640px}
h1{font-size:clamp(38px,7vw,60px);line-height:1;margin:0;font-weight:800;letter-spacing:-.6px;text-wrap:balance}
.org{display:block;font-size:.42em;line-height:1.2;letter-spacing:0;margin-top:10px;color:var(--ink)}
.lead{font-size:17px;line-height:1.5;margin:4px 0 0;color:var(--muted);max-width:52ch}

.search{background:var(--paper);border-radius:28px;padding:14px;box-shadow:0 10px 30px var(--shadow);display:flex;flex-direction:column;gap:12px;margin:6px 0 22px}
.field{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:20px;padding:4px 6px 4px 16px}
.field svg{width:22px;height:22px;flex:none;color:var(--muted)}
#q{flex:1;min-width:0;border:0;background:transparent;font-size:18px;font-weight:700;padding:13px 0;outline:none}
#q::placeholder{color:var(--muted);font-weight:600}
.clear{border:0;background:transparent;width:40px;height:40px;border-radius:14px;cursor:pointer;font-size:20px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin-right:4px}
.count{font-size:14px;color:var(--muted);font-weight:600;margin:0 4px 12px;font-variant-numeric:tabular-nums}

.spot{display:flex;gap:22px;align-items:center;background:var(--paper);border-radius:32px;padding:22px;margin-bottom:22px;
  box-shadow:0 14px 40px var(--shadow);animation:pop .6s cubic-bezier(.2,.9,.25,1.2) both;cursor:pointer;border:0;width:100%;text-align:left}
.spot .av{width:120px;height:120px}
.spot .who{min-width:0;display:flex;flex-direction:column;gap:6px}
.spot .hey{font-size:13px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:1.4px}
.spot .fn{font-size:clamp(30px,5vw,44px);font-weight:800;line-height:1.05;text-wrap:balance}
.spot .meta{color:var(--muted);font-size:15px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{position:relative;border:0;cursor:pointer;background:var(--paper);border-radius:26px;padding:14px 16px 14px 14px;
  display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 8px 24px var(--shadow);
  animation:up .55s cubic-bezier(.2,.8,.2,1) both;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:0 16px 34px var(--shadow)}
.card:hover .av svg,.card:hover .av img{animation:bob 1.2s ease-in-out infinite}
.card .av{width:72px;height:72px}
.card .txt{min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start;padding-right:30px}
.card .fn{font-size:18px;font-weight:800;line-height:1.15;text-wrap:balance}
.fio{font-size:14px;font-weight:700;color:var(--ink)}
.yr-b{position:absolute;top:10px;right:12px;font-size:12px;font-weight:800;color:var(--orange);font-variant-numeric:tabular-nums}

.empty{background:var(--paper);border-radius:32px;padding:30px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;box-shadow:0 10px 30px var(--shadow);animation:pop .5s both}
.empty b{font-size:24px;font-weight:800}
.empty p{margin:0;color:var(--muted);line-height:1.5;max-width:42ch}
.add-row{display:flex;justify-content:center;margin-top:26px}

.rev .halo{position:relative;width:200px;margin:0 auto}
.rev .av{width:200px;height:200px;animation:rise .8s cubic-bezier(.2,.9,.25,1.15) both}
.rev .ring{position:absolute;inset:-10px;border-radius:50%;border:3px dashed var(--orange);opacity:.55;animation:spin 18s linear infinite}
.rev .name{font-size:clamp(34px,9vw,46px);font-weight:800;line-height:1.05;margin:22px 0 8px;text-wrap:balance}
.rev .name .w{display:inline-block;white-space:nowrap}
.rev .name i{font-style:normal;display:inline-block;color:var(--g1);animation:letter .6s cubic-bezier(.2,.9,.25,1.4) both,wave 4.5s ease-in-out infinite}
@keyframes wave{0%,100%{color:var(--g1)}33%{color:var(--g2)}66%{color:var(--g3)}}
@keyframes letter{from{opacity:0;transform:translateY(24px) rotate(10deg) scale(.6)}}
.rev .sub{color:var(--muted);font-size:15px;line-height:1.5;margin-top:8px}
.rev .fio{font-size:17px;margin-top:4px}
.rev .tags{justify-content:center;margin-top:10px}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.done b{font-size:24px}
.done p{margin:0;color:var(--muted);line-height:1.5}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media(max-width:520px){.spot{flex-direction:column;text-align:center}.spot .who{align-items:center}}
</style>
</head>
<body>
<canvas id="forest" aria-hidden="true"></canvas>
<div class="page">
  <svg class="blob" aria-hidden="true" viewBox="0 0 200 160" style="right:-40px;top:-30px;width:240px;height:190px"><path d="M40 0h160v150c-30 10-55-10-62-40-8-34-40-30-70-46C40 50 20 20 40 0z" fill="#284F36"/><path d="M110 0h90v40c-25 12-55 0-70-14-8-8-15-16-20-26z" fill="#D85B21"/></svg>

  <header class="hero">
    <div class="kick">Летопись леса</div>
    <h1><span class="live">Лесные имена</span> <span class="org">организации «Байкальский Скаут»</span></h1>
    <p class="lead">Найдите своё имя: введите ФИО, лесное имя или год получения имени. Нет в списке — добавьте себя.</p>
  </header>

  <section class="search" aria-label="Поиск">
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="text" placeholder="Например, Сова или Иванов" autocomplete="off" aria-label="Поиск по базе">
      <button class="clear" id="clr" type="button" aria-label="Очистить" hidden>×</button>
    </div>
    <div class="row" id="fields"><span class="lbl">Искать в</span></div>
    <div class="row" id="years"><span class="lbl">Год</span></div>
  </section>

  <div class="count" id="count" aria-live="polite"></div>
  <div id="spot"></div>
  <div class="grid" id="grid"></div>
  <div id="empty"></div>
  <div class="add-row"><button class="btn ghost" type="button" data-add="">+ Добавить своё лесное имя</button></div>
</div>

<div class="veil" id="revVeil" hidden><div class="box rev" id="rev" role="dialog" aria-modal="true" aria-label="Лесное имя"></div></div>
<div class="veil" id="formVeil" hidden><div class="box form" id="formBox" role="dialog" aria-modal="true" aria-label="Добавить имя"></div></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function () {
var esc = LI.esc, norm = LI.norm, TINT = LI.TINT;
var $ = function (s) { return document.querySelector(s); };
var D = [], st = {q: '', fields: {name: true, fio: true, year: true}, year: 'all'};

function av(p) {
  return '<div class="av ' + (TINT[p.s] || 'c-g') + '">' + (p.photo ? '<img src="' + esc(p.photo) + '" alt="" loading="lazy">' : '<svg aria-hidden="true"><use href="#s-' + p.s + '"/></svg>') + '</div>';
}
function tags(p) {
  return p.otr ? '<div class="tags">' + p.otr.split(',').map(function (t) { return t.trim(); }).filter(Boolean).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '';
}
function plural(n) { var a = n % 10, b = n % 100; return a === 1 && b !== 11 ? 'имя' : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? 'имени' : 'имён'; }

// чипы «искать в»
[['name', 'Лесное имя'], ['fio', 'ФИО'], ['year', 'Год']].forEach(function (x) {
  var b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = x[1]; b.setAttribute('aria-pressed', 'true');
  b.onclick = function () {
    var on = Object.keys(st.fields).filter(function (k) { return st.fields[k]; }).length;
    if (st.fields[x[0]] && on === 1) return;
    st.fields[x[0]] = !st.fields[x[0]]; b.setAttribute('aria-pressed', st.fields[x[0]]); render();
  };
  $('#fields').appendChild(b);
});
function buildYears() {
  $('#years').querySelectorAll('.chip').forEach(function (c) { c.remove(); });
  var ys = {}; D.forEach(function (p) { ys[p.year || '—'] = 1; });
  var list = ['all'].concat(Object.keys(ys).sort(function (a, b) { return a === '—' ? 1 : b === '—' ? -1 : a - b; }));
  list.forEach(function (y) {
    var b = document.createElement('button'); b.className = 'chip yr'; b.type = 'button';
    b.textContent = y === 'all' ? 'Все' : y === '—' ? 'Без года' : y; b.setAttribute('aria-pressed', y === st.year);
    b.onclick = function () { st.year = y; $('#years').querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', c === b); }); render(); };
    $('#years').appendChild(b);
  });
}

function match(p) {
  if (st.year !== 'all' && (p.year || '—') !== st.year) return false;
  var q = norm(st.q); if (!q) return true;
  return q.split(/\s+/).every(function (w) {
    return (st.fields.name && norm(p.name).indexOf(w) >= 0) || (st.fields.fio && norm(p.fio).indexOf(w) >= 0) || (st.fields.year && p.year.indexOf(w) >= 0);
  });
}

function render() {
  var res = D.filter(match);
  $('#count').textContent = res.length + ' ' + plural(res.length) + ' из ' + D.length;
  $('#grid').innerHTML = res.map(function (p, k) {
    return '<button class="card" type="button" data-i="' + p.i + '" style="animation-delay:' + Math.min(k * 28, 700) + 'ms">' + av(p) +
      (p.year ? '<span class="yr-b">' + esc(p.year) + '</span>' : '') +
      '<span class="txt"><span class="fn live">' + esc(p.name) + '</span>' + (p.fio ? '<span class="fio">' + esc(p.fio) + '</span>' : '') + tags(p) + '</span></button>';
  }).join('');
  var one = st.q && res.length === 1 ? res[0] : null;
  $('#spot').innerHTML = one ? '<button class="spot" type="button" data-i="' + one.i + '">' + av(one) + '<span class="who"><span class="hey">Нашли!</span><span class="fn live">' + esc(one.name) + '</span>' +
    '<span class="meta">' + esc([one.fio, one.otr, one.year].filter(Boolean).join(' · ')) + '</span><span class="meta">Нажмите, чтобы открыть</span></span></button>' : '';
  $('#empty').innerHTML = res.length ? '' : '<div class="empty"><div class="av c-o" style="width:110px;height:110px"><svg aria-hidden="true"><use href="#s-q"/></svg></div>' +
    '<b>Такого имени пока нет</b><p>Возможно, вы есть в базе под другим написанием. Если нет — отправьте заявку, и после проверки имя появится здесь.</p>' +
    '<button class="btn" type="button" data-add="' + esc(st.q) + '">' + (st.q ? 'Добавить «' + esc(st.q) + '»' : 'Добавить своё имя') + '</button></div>';
  $('#clr').hidden = !st.q;
}

function showState(html) { $('#count').textContent = ''; $('#spot').innerHTML = ''; $('#grid').innerHTML = ''; $('#empty').innerHTML = html; }
function load() {
  if (!LI.configured) { showState('<div class="empty"><b>Сайт ещё не подключён к базе</b><p>Заполните imena/config.js по инструкции SETUP.md.</p></div>'); return; }
  $('#grid').innerHTML = Array(9).join('<div class="skel"></div>'); $('#empty').innerHTML = '';
  LI.fetchNames().then(function (rows) {
    D = rows.map(function (r, i) {
      return {i: i, id: r.id, fio: r.fio || '', otr: r.otryad || '', name: r.forest_name, year: r.year ? String(r.year) : '', s: r.silhouette || 'w', photo: LI.photoUrl(r.photo_path)};
    });
    buildYears(); render();
  }).catch(function (e) {
    console.error(e);
    showState('<div class="empty"><b>Не получилось загрузить базу</b><p>Проверьте интернет и попробуйте ещё раз.</p><button class="btn" type="button" id="retry">Обновить</button></div>');
    $('#retry').onclick = load;
  });
}

document.addEventListener('click', function (e) {
  var c = e.target.closest('[data-i]'); if (c) { reveal(D[+c.getAttribute('data-i')]); return; }
  var a = e.target.closest('[data-add]'); if (a) { openForm(a.getAttribute('data-add') || ''); return; }
  if (e.target.closest('[data-close]') || e.target.classList.contains('veil')) closeAll();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeAll(); });
function closeAll() { $('#revVeil').hidden = true; $('#formVeil').hidden = true; }
$('#q').addEventListener('input', function (e) { st.q = e.target.value; render(); });
$('#clr').onclick = function () { st.q = ''; $('#q').value = ''; render(); $('#q').focus(); };

function reveal(p) {
  var k = 0, letters = p.name.split(/\s+/).map(function (word) {
    return '<span class="w">' + Array.from(word).map(function (ch) { var d = k++; return '<i style="animation-delay:' + (250 + d * 55) + 'ms,' + (d * 140) + 'ms">' + esc(ch) + '</i>'; }).join('') + '</span>';
  }).join(' ');
  $('#rev').innerHTML = '<button class="x" type="button" data-close aria-label="Закрыть">×</button>' +
    '<div class="halo"><div class="ring"></div>' + av(p) + '</div><div class="name">' + letters + '</div>' +
    (p.fio ? '<div class="fio">' + esc(p.fio) + '</div>' : '') + tags(p) +
    '<div class="sub">' + (p.year ? 'Имя получено в ' + esc(p.year) + ' году' : 'Год не указан') + '</div>';
  $('#revVeil').hidden = false; $('#rev .x').focus();
}

function openForm(pre) {
  var fioLike = /\s/.test(pre.trim()) || /^[А-ЯЁ][а-яё]+(ов|ев|ин|ова|ева|ина|ий|ая|ко|ук|юк)$/.test(pre.trim());
  $('#formBox').innerHTML = '<button class="x" type="button" data-close aria-label="Закрыть">×</button>' +
  '<h2>Добавить лесное имя</h2><p class="note">Заявка уходит организаторам. Имя появится в базе после проверки.</p>' +
  '<form id="fm" novalidate style="display:flex;flex-direction:column;gap:14px">' +
    '<div class="f"><label for="ff">ФИО</label><input id="ff" type="text" maxlength="120" autocomplete="name" value="' + (fioLike ? esc(pre) : '') + '" placeholder="Фамилия Имя"></div>' +
    '<div class="two"><div class="f"><label for="fo">Отряд</label><input id="fo" type="text" maxlength="120" placeholder="Например, Хаски"></div>' +
    '<div class="f"><label for="fy">Год получения</label><input id="fy" type="number" inputmode="numeric" min="1900" max="2100" placeholder="' + new Date().getFullYear() + '"></div></div>' +
    '<div class="f"><label for="fn">Ваше лесное имя</label><input id="fn" type="text" maxlength="60" value="' + (fioLike ? '' : esc(pre)) + '" placeholder="Например, Рысь"><span class="warn" id="dup" hidden></span></div>' +
    '<div class="hp" aria-hidden="true"><label for="fw">Сайт</label><input id="fw" type="text" tabindex="-1" autocomplete="off"></div>' +
    '<label class="check"><input id="fp" type="checkbox"> Хочу добавить фото</label>' +
    '<div id="photoBox" hidden style="display:flex;flex-direction:column;gap:12px">' +
      '<label class="drop" for="file"><span class="av c-g" id="prev"><svg aria-hidden="true"><use href="#s-w"/></svg></span><span><b>Выбрать фото</b><span>JPG, PNG или WebP, до 15 МБ</span></span></label>' +
      '<input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden>' +
      '<label class="check"><input id="fc" type="checkbox"> Согласен(на) на публикацию фото на сайте. Если участнику нет 18 лет, согласие даёт родитель.</label>' +
    '</div><span class="warn" id="err" hidden role="alert"></span>' +
    '<button class="btn" type="submit" id="send">Отправить заявку</button></form>';
  $('#formVeil').hidden = false;
  var blob = null;
  function err(t) { $('#err').hidden = !t; $('#err').textContent = t || ''; }
  function chkDup() {
    var v = norm($('#fn').value), hit = null;
    D.forEach(function (p) { if (v && norm(p.name) === v) hit = p; });
    $('#dup').hidden = !hit; if (hit) $('#dup').textContent = 'Имя «' + hit.name + '» уже есть в базе. Заявку всё равно можно отправить — организаторы решат.';
  }
  $('#fn').oninput = chkDup; chkDup();
  $('#fp').onchange = function (e) { $('#photoBox').hidden = !e.target.checked; };
  $('#file').onchange = function (e) {
    var f = e.target.files[0]; blob = null; if (!f) return; err('');
    if (f.size > 15e6) { err('Фото больше 15 МБ — выберите поменьше.'); return; }
    LI.prepPhoto(f).then(function (b) { blob = b; $('#prev').innerHTML = '<img src="' + URL.createObjectURL(b) + '" alt="">'; }).catch(function (x) { err(x.message); });
  };
  $('#fm').onsubmit = function (e) {
    e.preventDefault(); err('');
    var fio = $('#ff').value.trim(), name = $('#fn').value.trim(), yr = $('#fy').value.trim(), withPhoto = $('#fp').checked;
    if (fio.length < 2) return err('Укажите ФИО.');
    if (!name) return err('Укажите лесное имя.');
    if (yr && !(+yr >= 1900 && +yr <= 2100)) return err('Год — четыре цифры, например ' + new Date().getFullYear() + '.');
    if (withPhoto && !blob) return err('Выберите фото или снимите галочку «Хочу добавить фото».');
    if (withPhoto && !$('#fc').checked) return err('Отметьте согласие на публикацию фото.');
    var done = function () {
      $('#formBox').innerHTML = '<button class="x" type="button" data-close aria-label="Закрыть">×</button><div class="done">' +
        '<div class="av c-g" style="width:110px;height:110px;animation:rise .7s both"><svg aria-hidden="true"><use href="#s-l"/></svg></div>' +
        '<b class="live">Заявка отправлена</b><p>«' + esc(name) + '» появится в базе, когда организаторы её проверят.</p>' +
        '<button class="btn" type="button" data-close>Готово</button></div>';
    };
    if ($('#fw').value) return done(); // ловушка для ботов
    $('#send').disabled = true; $('#send').textContent = 'Отправляем…';
    (withPhoto ? LI.uploadRequestPhoto(blob) : Promise.resolve(null)).then(function (path) {
      return LI.sendRequest({fio: fio, otryad: $('#fo').value.trim(), forest_name: name, year: yr ? +yr : null, photo_path: path, photo_consent: withPhoto});
    }).then(done).catch(function (x) {
      console.error(x);
      $('#send').disabled = false; $('#send').textContent = 'Отправить заявку';
      err('Не получилось отправить. Проверьте интернет и попробуйте ещё раз.');
    });
  };
  setTimeout(function () { ($('#ff').value ? $('#fn') : $('#ff')).focus(); }, 60);
}

load();

// фон: падающие листья и светлячки
(function () {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = $('#forest'), cx = cv.getContext('2d'), W, H;
  function size() { var d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; cx.setTransform(d, 0, 0, d, 0, 0); }
  size(); addEventListener('resize', size);
  var css = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }, cols = [], tick = 0;
  var leaves = Array.from({length: 16}, function () { return {x: Math.random() * W, y: Math.random() * H, r: 6 + Math.random() * 9, a: Math.random() * 6.3, vy: .25 + Math.random() * .5, sw: Math.random() * 6.3, k: Math.floor(Math.random() * 3)}; });
  var flies = Array.from({length: 22}, function () { return {x: Math.random() * W, y: Math.random() * H, t: Math.random() * 6.3, s: .3 + Math.random() * .6}; });
  function frame() {
    if (!(tick++ % 120)) cols = [css('--green'), css('--orange'), css('--sand')];
    cx.clearRect(0, 0, W, H);
    leaves.forEach(function (l) {
      l.y += l.vy; l.sw += .012; l.x += Math.sin(l.sw) * .6; l.a += .01; if (l.y > H + 20) { l.y = -20; l.x = Math.random() * W; }
      cx.save(); cx.translate(l.x, l.y); cx.rotate(l.a); cx.globalAlpha = .28; cx.fillStyle = cols[l.k];
      cx.beginPath(); cx.moveTo(0, -l.r); cx.quadraticCurveTo(l.r * .8, 0, 0, l.r); cx.quadraticCurveTo(-l.r * .8, 0, 0, -l.r); cx.fill(); cx.restore();
    });
    flies.forEach(function (f) {
      f.t += .02 * f.s; f.x += Math.cos(f.t * 1.3) * .3; f.y += Math.sin(f.t) * .3;
      var g = .25 + .35 * Math.max(0, Math.sin(f.t * 2));
      cx.globalAlpha = g; cx.fillStyle = cols[1]; cx.beginPath(); cx.arc(f.x, f.y, 2, 0, 6.3); cx.fill();
      cx.globalAlpha = g * .25; cx.beginPath(); cx.arc(f.x, f.y, 7, 0, 6.3); cx.fill();
    });
    cx.globalAlpha = 1; requestAnimationFrame(frame);
  }
  frame();
})();
})();
</script>
